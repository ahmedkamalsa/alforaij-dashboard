# docker-compose.yml — نظام أتمتة السوق العقاري الكويتي
# المشروع: alforaijboard / bwspcsiazbwrrxpgoldx
# يستخدم LM Studio Local LLM + Supabase
# يدير 3 حاويات: market-analyzer, supabase-sync, monitor
#
# ملاحظة: الـ Local LLM API يعمل على الجهاز المضيف (localhost:1234)
# للحاويات للوصول له، نستخدم host.docker.internal (Docker Desktop على Windows)

version: '3.8'

services:
  # ─── السكربت أتمتة السوق اليومي ──────────────────────────────
  market-analyzer:
    build:
      context: .
      dockerfile: Dockerfile.market
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - LOCAL_API_URL=http://host.docker.internal:1234/v1/chat/completions
    volumes:
      - ./cron_logs:/app/cron_logs
      - ./reports:/app/reports
      - ./notifications:/app/notifications
      - ./cache:/app/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # يشغل كل 24 ساعة
    # يمكن استخدام cron داخل الحاوية أو الاعتماد على الخارج

  # ─── تحديث قاعدة البيانات الحية ──────────────────────────────
  supabase-sync:
    build:
      context: .
      dockerfile: Dockerfile.sync
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    volumes:
      - ./site/static-data:/app/site/static-data
      - ./cache:/app/cache
    restart: unless-stopped

  # ─── نظام المراقبة ────────────────────────────────────────────
  monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - LOCAL_API_URL=http://host.docker.internal:1234/v1/chat/completions
    volumes:
      - ./cron_logs:/app/cron_logs
      - ./notifications:/app/notifications
      - ./cache:/app/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # يشغّل كل ساعة للتحقق من صحة النظام

  # ─── واجهة تحكم بسيطة (اختياري) ──────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./reports:/app/reports:ro
      - ./cron_logs:/app/cron_logs:ro
    restart: unless-stopped
